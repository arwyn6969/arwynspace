# Cloudflare Workers configuration — static assets, no Worker script.
#
# This sits alongside vercel.json rather than replacing it. The two hosts read
# different files and neither is confused by the other's presence, so the site can
# be deployed to either or both.
#
# WHY WORKERS AND NOT PAGES
#
# Cloudflare's own guidance: "Workers Static Assets is the recommended way to
# deploy static sites... If you are starting a new project, use Workers instead of
# Pages. Pages continues to work, but new features and optimizations are focused
# on Workers." An earlier version of this file used `pages_build_output_dir`, which
# is a Pages key — `npx wrangler deploy` would have rejected it.
#
# WHY THERE IS A `main` AT ALL FOR A STATIC SITE
#
# A purely static site needs no Worker script — `assets.directory` alone would be a
# complete configuration. The script exists for one reason: serving the same build
# under a path prefix as well as at a root.
#
#   https://arwynspace.mrarwyn.workers.dev/   — root
#   https://arwyn.party/bitcoinart/           — prefixed
#
# `arwyn.party/*` already belongs to another Worker (emblem-homepage-home), so this
# one claims only `arwyn.party/bitcoinart*`. Cloudflare resolves overlapping routes
# by specificity, so the longer pattern wins for those paths and the rest of the
# domain is untouched.
#
# src/worker.js strips the prefix and hands the request to the assets binding. It
# runs only for paths no asset matched, because `run_worker_first` is deliberately
# NOT set: the asset router stays in front so `public/_headers` keeps applying to
# unprefixed requests. Cloudflare documents that custom headers are not attached to
# responses generated by Worker code, and names run_worker_first as a case where you
# must reapply them yourself — which would mean a second copy of the cache config,
# free to drift.
#
# WHY A STATIC DEPLOY IS ENOUGH
#
# The client asks for /api/holders, /api/market, /api/stats and /api/mega first and
# falls back to the committed snapshots in public/data/ when those 404 (see
# loadHolders and friends in public/app.js). public/data/ is tracked in git on
# purpose, so a host serving only static files still renders the whole site:
# gallery, Collected, Collectors, Market and every artwork page. The API routes
# normalise units server-side and save a round trip; here they are an optimisation,
# not a requirement.
#
# Routing needs no rewrite rule. The app uses hash routes (#/collected,
# #/art/CARPOPODITE), so every URL is served by index.html without a
# single-page-application fallback — one of the few real advantages of hash routing.
#
# public/_headers is honoured: `_headers` and `_redirects` are supported natively by
# Workers static assets, provided they sit inside the assets directory. It is not
# itself served as a file.
#
# NODE VERSION IS PINNED IN .node-version (22), AND IT HAS TO BE.
#
# Every script here uses `import.meta.dirname`, which landed in Node 20.11. Build
# environments have historically defaulted to Node 18, where that property is
# undefined — so `path.resolve(import.meta.dirname, "..")` throws and the build
# fails with an error that points nowhere near the real cause. Do not delete it.
# package.json declares engines >=20, but that is a declaration to consumers, not
# an instruction to the build host.
#
# WORKERS BUILDS SETTINGS THAT GO WITH THIS FILE
#
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Root directory:  /
#
# `npm run build` stages data/ into public/data/ and injects the artist name and
# tagline from config/wallets.json. Keep it. Do NOT use `npm run ship` here — that
# also writes dist/gallery.html, which is gitignored and is not what gets served.
#
# There are no runtime dependencies, so the automatic `npm install` is a no-op.
# Setting SKIP_DEPENDENCY_INSTALL is unnecessary either way.
#
# vercel.json also declares a cron (*/15 on /api/mega). Workers would express that
# as a cron trigger, but that cron only warms a cache — the real daily data refresh
# is .github/workflows/refresh.yml.

name = "arwynspace"
compatibility_date = "2026-08-27"
main = "./src/worker.js"

# Keep the workers.dev URL working alongside the custom route.
workers_dev = true

# Carve /bitcoinart out of arwyn.party. The apex and www are routed to another
# Worker; these longer patterns take precedence for this path only.
routes = [
  { pattern = "arwyn.party/bitcoinart*", zone_name = "arwyn.party" },
  { pattern = "www.arwyn.party/bitcoinart*", zone_name = "arwyn.party" },
]

[assets]
directory = "./public"
# The binding is what lets src/worker.js serve an asset for a rewritten path.
binding = "ASSETS"

[observability]
enabled = true
